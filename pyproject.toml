[project]
name = "grubmgr"
version = "0.1.0"
description = "Grub Themes manager by iReyzer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reyzer", email = "reyzervt@gmail.com" }]
requires-python = ">=3.12"
keywords = ["grub", "themes", "archlinux", "qt"]
dependencies = [
    "argparse>=1.4.0",
]

[project.optional-dependencies]
gui = ["pyside6>=6.12.0"]

[project.urls]
Homepage = "https://github.com/<usuario>/grubmgr"
Issues = "https://github.com/<usuario>/grubmgr/issues"

[project.scripts]
grubmgr = "grubmgr:main"
grubmgr-gui = "grubmgr.gui.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.15"]
build-backend = "uv_build"